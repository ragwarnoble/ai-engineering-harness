[project]
name = "ai-engineering-harness"
version = "0.1.0"
description = "A reusable engineering harness for AI-assisted software development."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
source = ["src/harness"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[project.scripts]
harness = "harness.cli:main"
